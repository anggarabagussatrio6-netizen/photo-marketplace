<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard - FotoKita</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body onload="checkLogin()">


<nav class="navbar">

    <div class="logo">
        📷 FotoKita
    </div>

    <div class="nav-links">

        <a href="index.html">
            Marketplace
        </a>

        <a
            href="#"
            onclick="logoutUser()">

            Logout

        </a>

    </div>

</nav>


<div class="container">


    <div class="dashboard-header">

        <div>

            <h1>
                Dashboard
            </h1>

            <p>
                Kelola karya fotografimu.
            </p>

        </div>

    </div>


    <div class="panel">

        <h2>
            Upload Karya
        </h2>

        <br>


        <div class="form-group">

            <label>
                Judul Foto
            </label>

            <input
                type="text"
                placeholder="Contoh: Sunset di Gunung">

        </div>


        <div class="form-group">

            <label>
                Deskripsi
            </label>

            <textarea
                placeholder="Ceritakan tentang foto ini..."></textarea>

        </div>


        <div class="form-group">

            <label>
                Harga
            </label>

            <input
                type="number"
                placeholder="50000">

        </div>


        <div class="form-group">

            <label>
                File Foto
            </label>

            <input
                type="file"
                accept="image/*">

        </div>


        <button class="btn btn-success">

            Terbitkan Foto

        </button>

    </div>


    <div class="panel">

        <h2>
            Karya Saya
        </h2>

        <br>

        <div class="photo-grid">


            <div class="photo-card">

                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80">

                <div class="photo-info">

                    <h3>
                        Contoh Foto
                    </h3>

                    <p>
                        Status: Demo
                    </p>

                    <div class="price">
                        Rp50.000
                    </div>

                </div>

            </div>


        </div>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
