<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - FotoKita</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📷 FotoKita
    </div>

    <div class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="login.html">Login</a>
    </div>

</nav>


<div class="container">

    <div class="auth-box">

        <h1>Buat Akun</h1>

        <p class="subtitle">
            Bergabung dan mulai pamerkan karya fotografimu.
        </p>


        <div class="form-group">

            <label>Nama</label>

            <input
                type="text"
                id="name"
                placeholder="Nama kamu"
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="nama@email.com"
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

        </div>


        <button
            class="btn btn-primary btn-full"
            onclick="registerUser()">

            Daftar

        </button>


        <p style="margin-top:20px;">
            Sudah punya akun?
            <a href="login.html" style="color:#2563eb;">
                Login
            </a>
        </p>

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
