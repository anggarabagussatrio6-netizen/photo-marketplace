<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FotoKita - Marketplace Foto</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        📷 FotoKita
    </div>


    <div class="nav-links">

        <a href="index.html">
            Marketplace
        </a>

        <a href="login.html" id="loginLink">
            Login
        </a>

        <a href="register.html" id="registerLink">
            Daftar
        </a>

        <a href="dashboard.html"
           id="dashboardLink"
           style="display:none;">
            Dashboard
        </a>

        <a href="#"
           id="logoutLink"
           onclick="logoutUser()"
           style="display:none;">
            Logout
        </a>

    </div>

</nav>



<div class="container">


    <!-- HERO -->

    <div class="panel"
         style="text-align:center; padding:50px 25px;">

        <h1>
            Temukan Foto Terbaik
        </h1>

        <p style="margin-top:12px; color:#666;">

            Jelajahi dan beli karya fotografi
            dari para kreator.

        </p>

    </div>



    <!-- SEARCH -->

    <div class="panel">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Cari foto..."
            oninput="loadPhotos()">

    </div>



    <!-- MARKETPLACE -->

    <div>

        <h2 style="margin-bottom:20px;">
            Karya Terbaru
        </h2>


        <div
            id="photoGrid"
            class="photo-grid">

        </div>

    </div>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>



<script>


/* =========================
   CEK USER
========================= */

async function checkUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (user) {

        document.getElementById(
            "loginLink"
        ).style.display = "none";


        document.getElementById(
            "registerLink"
        ).style.display = "none";


        document.getElementById(
            "dashboardLink"
        ).style.display = "inline";


        document.getElementById(
            "logoutLink"
        ).style.display = "inline";

    }

}



/* =========================
   LOAD FOTO
========================= */

async function loadPhotos() {

    const grid =
        document.getElementById(
            "photoGrid"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value.trim();


    grid.innerHTML =
        "<p>Memuat foto...</p>";


    let query =
        supabaseClient
            .from("photos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (search) {

        query =
            query.or(
                `title.ilike.%${search}%,description.ilike.%${search}%`
            );

    }


    const {
        data,
        error
    } = await query;


    if (error) {

        console.error(error);

        grid.innerHTML =
            "<p>Gagal mengambil foto.</p>";

        return;

    }


    if (!data || data.length === 0) {

        grid.innerHTML =
            "<p>Belum ada foto yang tersedia.</p>";

        return;

    }


    grid.innerHTML = "";


    data.forEach(photo => {


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "photo-card";


        card.innerHTML = `

            <img
                src="${photo.image_url}"
                alt="${escapeHtml(
                    photo.title
                )}">


            <div class="photo-info">

                <h3>
                    ${escapeHtml(
                        photo.title
                    )}
                </h3>


                <p style="margin-top:8px;">
                    ${escapeHtml(
                        photo.description || ""
                    )}
                </p>


                <div class="price">

                    Rp${Number(
                        photo.price
                    ).toLocaleString(
                        "id-ID"
                    )}

                </div>


                <button
                    class="btn btn-primary btn-full"
                    style="margin-top:12px;"
                    onclick="buyPhoto('${photo.id}')">

                    🛒 Beli Foto

                </button>

            </div>

        `;


        grid.appendChild(card);

    });

}



/* =========================
   BELI
========================= */



async function buyPhoto(photoId) {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    window.location.href = "photo.html?id=" + photoId;

}




/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}



/* =========================
   LOGOUT
========================= */

async function logoutUser() {

    await supabaseClient.auth.signOut();

    window.location.reload();

}



/* =========================
   START
========================= */

checkUser();

loadPhotos();


</script>


</body>

</html>
