<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - FotoKita</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        📷 FotoKita
    </div>

    <div class="nav-links">

        <a href="index.html">
            Beranda
        </a>

        <a href="register.html">
            Daftar
        </a>

    </div>

</nav>


<div class="container">

    <div class="auth-box">

        <h1>Login</h1>

        <p class="subtitle">
            Masuk ke akun FotoKita.
        </p>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="nama@email.com">

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password">

        </div>


        <button
            class="btn btn-primary btn-full"
            onclick="loginUser()">

            Login

        </button>


        <p style="margin-top:20px;">

            Belum punya akun?

            <a
                href="register.html"
                style="color:#2563eb;">

                Daftar sekarang

            </a>

        </p>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
