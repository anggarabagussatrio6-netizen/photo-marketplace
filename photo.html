<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detail Foto - FotoKita</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📷 FotoKita
    </div>

    <div class="nav-links">
        <a href="index.html">Marketplace</a>
        <a href="dashboard.html">Dashboard</a>
    </div>

</nav>


<div class="container">

    <div id="photoDetail" class="panel">
        Memuat foto...
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<script>

async function loadPhoto() {

    const params =
        new URLSearchParams(window.location.search);

    const photoId =
        params.get("id");


    if (!photoId) {

        document.getElementById(
            "photoDetail"
        ).innerHTML =
            "<h2>Foto tidak ditemukan.</h2>";

        return;

    }


    const {
        data,
        error
    } = await supabaseClient
        .from("photos")
        .select("*")
        .eq("id", photoId)
        .single();


    if (error || !data) {

        document.getElementById(
            "photoDetail"
        ).innerHTML =
            "<h2>Foto tidak ditemukan.</h2>";

        return;

    }


    document.getElementById(
        "photoDetail"
    ).innerHTML = `

        <img
            src="${data.image_url}"
            alt="${escapeHtml(data.title)}"
            style="
                width:100%;
                max-height:650px;
                object-fit:contain;
                border-radius:12px;
            ">


        <div style="margin-top:25px;">

            <h1>
                ${escapeHtml(data.title)}
            </h1>


            <p style="margin-top:12px;">
                ${escapeHtml(
                    data.description || ""
                )}
            </p>


            <div class="price"
                 style="margin-top:20px;">

                Rp${Number(
                    data.price
                ).toLocaleString("id-ID")}

            </div>


            <button
                class="btn btn-primary"
                style="margin-top:20px;"
                onclick="buyPhoto('${data.id}')">

                🛒 Beli Foto

            </button>

        </div>

    `;

}


async function buyPhoto(id) {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    alert(
        "Pembayaran akan kita sambungkan setelah sistem transaksi selesai."
    );

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


loadPhoto();

</script>

</body>
</html>
